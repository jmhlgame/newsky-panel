<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel de Vuelos – Newsky</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 20px;
    }
    h1 {
        text-align: center;
        color: #333;
    }
    #search {
        width: 300px;
        padding: 10px;
        margin: 20px auto;
        display: block;
        border: 1px solid #aaa;
        border-radius: 8px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        background: white;
        border-radius: 10px;
        overflow: hidden;
    }
    th {
        background: #007bff;
        color: white;
        padding: 12px;
    }
    td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: center;
    }
    tr:hover {
        background: #f1f1f1;
    }
    .status {
        padding: 6px 10px;
        border-radius: 6px;
        color: white;
        font-weight: bold;
    }
    .ENRUTA { background: #28a745; }
    .FINALIZADO { background: #6c757d; }
    .RETRASADO { background: #dc3545; }
</style>
</head>
