<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel de Vuelos – Newsky</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 20px;
    }
    h1 {
        text-align: center;
        color: #333;
    }
    #search {
        width: 300px;
        padding: 10px;
        margin: 20px auto;
        display: block;
        border: 1px solid #aaa;
        border-radius: 8px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        background: white;
        border-radius: 10px;
        overflow: hidden;
    }
    th {
        background: #007bff;
        color: white;
        padding: 12px;
    }
    td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: center;
    }
    tr:hover {
        background: #f1f1f1;
    }
    .status {
        padding: 6px 10px;
        border-radius: 6px;
        color: white;
        font-weight: bold;
    }
    .ENRUTA { background: #28a745; }
    .FINALIZADO { background: #6c757d; }
    .RETRASADO { background: #dc3545; }
</style>
</head>

<body>
<h1>Panel de Vuelos – Newsky</h1>

<input type="text" id="search" placeholder="Buscar por origen, destino o aerolínea…">

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Origen</th>
            <th>Destino</th>
            <th>Estado</th>
            <th>Aerolínea</th>
        </tr>
    </thead>
    <tbody id="tablaVuelos"></tbody>
</table>

<script>
const API_KEY = "ASP_omuDZofI3Hpz8QRfoC2ezeXl6aGxZ4";
const ENDPOINT = `https://newsky.app/airline/public/flights?token=${API_KEY}`;

async function cargarVuelos() {
    try {
        const res = await fetch(ENDPOINT);
        const data = await res.json();

        const tabla = document.getElementById("tablaVuelos");
        tabla.innerHTML = "";

        data.forEach(v => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${v.id || ""}</td>
                <td>${v.origin || ""}</td>
                <td>${v.destination || ""}</td>
                <td><span class="status ${String(v.status).replace(" ", "")}">${v.status}</span></td>
                <td>${v.airline || ""}</td>
            `;
            tabla.appendChild(row);
        });
    } catch (e) {
        console.error("Error al cargar API:", e);
    }
}

// Buscador en tiempo real
document.getElementById("search").addEventListener("keyup", function() {
    const value = this.value.toLowerCase();
    const rows = document.querySelectorAll("#tablaVuelos tr");

    rows.forEach(r => {
        const text = r.innerText.toLowerCase();
        r.style.display = text.includes(value) ? "" : "none";
    });
});

// Carga inicial + refresco automático cada 60 segundos
cargarVuelos();
setInterval(cargarVuelos, 60000);
</script>

</body>
</html>
